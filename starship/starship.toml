[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[ $symbol • __SEASON_ICONS__ ]($style)'

[os.symbols]
Alpine = "🏔️"          # Mountain emoji (Swiss Alps)
Amazon = "📦"           # Package box emoji
Android = "🤖"          # Robot Face emoji
Arch = "🏹"             # Bow and Arrow emoji
Artix = "🌀"            # Cyclone emoji
CentOS = "🎯"           # Target / Bullseye emoji
Debian = "🌀"           # Cyclone / Spiral emoji
EndeavourOS = "🚀"      # Rocket emoji
Fedora = "🎩"           # Top Hat emoji
FreeBSD = "😈"          # Beastie daemon emoji
Garuda = "🦅"           # Eagle emoji
Gentoo = "🧬"           # DNA / compilation emoji
Kali = "🐉"             # Dragon emoji
Linux = "🐧"            # Penguin emoji
Macos = "🍏"            # Green Apple emoji
Manjaro = "🌲"          # Evergreen Tree emoji
Mint = "🌿"             # Herb / Mint leaf emoji
NixOS = "❄️"            # Snowflake emoji
OpenBSD = "🐡"          # Pufferfish emoji
Pop = "🍿"              # Popcorn emoji
Raspbian = "🍓"         # Strawberry emoji
Redhat = "🧢"           # Red Cap emoji
RedHatEnterprise = "🧢" # Red Cap emoji
RockyLinux = "🪨"       # Rock emoji
SUSE = "🦎"             # Lizard / Chameleon emoji
Ubuntu = "🟠"           # Orange circle emoji
Void = "🌌"             # Milky Way / Void emoji
Windows = "🪟"          # Window emoji

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "📄 Documents"
"Downloads" = "📥 Downloads"
"Music" = "🎧 Music"
"Pictures" = "🎨 Pictures"
"Developer" = "💻 Developer"
"dev" = "💻 dev"
"repos" = "📦 repos"
"Desktop" = "🖥️ Desktop"
"Videos" = "🎬 Videos"

[git_branch]
symbol = "🌿"
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($conflicted$stashed$modified$staged$untracked$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'
conflicted = "💥 $count"
stashed = "📦 $count"
modified = "📝 $count"
staged = "✨ $count"
untracked = "🔮 $count"
ahead = "⇡ $count"
behind = "⇣ $count"

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = "⚙️ "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = "🦀"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = "🐹"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = "🐘"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = "☕"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = "🎯"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = "λ"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = "🐍"
style = "bg:color_blue"
format = '[[ $symbol( $version 🛡️ $virtualenv) ](fg:color_fg0 bg:color_blue)]($style)'

[ruby]
symbol = "💎"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[elixir]
symbol = "💧"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[lua]
symbol = "🌙"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[zig]
symbol = "⚡"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[swift]
symbol = "🐦"
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = "🐳"
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_fg0 bg:color_bg3)]($style)'

[conda]
symbol = "🅒 "
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[cmd_duration]
min_time = 2_000
style = "bg:color_bg3"
format = '[[ ⏱️ $duration ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[✗](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_yellow)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
